# Builds the Linux and Windows packages on every push to main and publishes them as a new
# release tagged vYYYY.MM.DD-<commit>, marked latest. Every release is kept as version history
# (the old "nightly" release is removed). A pushed tag v* publishes that tag the same way.
# No game or console file is ever built in or uploaded.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  # Pull requests to main build both packages (artifacts only): the Release is left untouched.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: port
    env:
      CC: gcc-14
      CXX: g++-14
      PKG_CONFIG_PATH: /opt/tlgdeps/lib/pkgconfig:/opt/tlgdeps/lib64/pkgconfig:/opt/tlgdeps/lib/x86_64-linux-gnu/pkgconfig
      CMAKE_PREFIX_PATH: /opt/tlgdeps
      LD_LIBRARY_PATH: /opt/tlgdeps/lib:/opt/tlgdeps/lib64:/opt/tlgdeps/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-14 g++-14 cmake ninja-build pkg-config nasm \
            curl git python3-venv python3-tk libvulkan-dev glslang-tools libboost-dev \
            libxxhash-dev zlib1g-dev libx11-dev libxcb1-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl-dev libgl-dev libdrm-dev libgbm-dev libpulse-dev libasound2-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev libusb-1.0-0-dev libfreetype-dev
      - name: Cache built libraries
        id: deps
        uses: actions/cache@v4
        with:
          path: /opt/tlgdeps
          key: tlgdeps-ubuntu2404-${{ hashFiles('port/packaging/linux/build_deps.sh') }}
      - name: Build libraries (SDL3, Zydis, fmt, FFmpeg)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/tlgdeps && sudo chown "$USER" /opt/tlgdeps
          bash packaging/linux/build_deps.sh
      - name: Build
        run: TLG_LTO=OFF TLG_PGO=off bash build.sh
      - name: Package
        run: bash packaging/linux/package.sh
      - name: Smoke test (frozen Qt launcher)
        # Opens the packaged launcher offscreen and renders a frame: a package whose launcher cannot
        # start (missing Qt plugin, QML, font, translation) must not become a release.
        run: |
          set -euo pipefail
          smoke=$(mktemp -d)
          tar -C "$smoke" -xzf dist/infamous-linux-x86_64.tar.gz
          out=$(QT_QPA_PLATFORM=offscreen timeout 120 "$smoke/infamous-linux-x86_64/inFAMOUS Second Son" --selftest 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          grep -qx 'selftest ok' <<<"$out"
      - uses: actions/upload-artifact@v4
        with:
          name: infamous-linux-x86_64
          path: port/dist/infamous-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 3

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: port
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-freetype
      - name: Build
        env:
          MSYS2_ROOT: ${{ runner.temp }}/msys64
        run: |
          export MSYS2_ROOT=$(cygpath -u "$MSYS2_ROOT")
          TLG_LTO=OFF bash build.sh
      - name: Package
        env:
          MSYS2_ROOT: ${{ runner.temp }}/msys64
          WINPYTHON_WIN: ${{ steps.python.outputs.python-path }}
        run: |
          export MSYS2_ROOT=$(cygpath -u "$MSYS2_ROOT")
          export WINPYTHON=$(cygpath -u "$WINPYTHON_WIN")
          bash packaging/windows/package.sh
      - name: Smoke test (frozen Qt launcher)
        # Unzips the package and runs the frozen launcher with --selftest (Qt offscreen platform).
        # The windowed exe has no console, so it writes its result to a file that is checked here.
        shell: pwsh
        working-directory: port
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke'
          Remove-Item -Recurse -Force $smoke -ErrorAction SilentlyContinue
          Expand-Archive -Path dist/infamous-windows-x86_64.zip -DestinationPath $smoke
          $exe = Join-Path $smoke 'infamous-windows-x86_64/inFAMOUS Second Son.exe'
          $outFile = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          Remove-Item $outFile -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:ISS_SELFTEST_OUT = $outFile
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Error 'selftest timed out'; exit 1 }
          if (Test-Path $outFile) { Get-Content $outFile }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $outFile) -or -not ((Get-Content $outFile -Raw) -match 'selftest ok')) {
            Write-Error "selftest failed (exit code $($p.ExitCode))"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: infamous-windows-x86_64
          path: port/dist/infamous-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [linux, windows]
    # Only pushes publish (main -> vYYYY.MM.DD-<commit>, v* tags -> that tag); pull requests stop at the artifacts.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/ARQUIVOS_NECESSARIOS.md
            .github/scripts/release_notes.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        id: publish
        run: |
          set -euo pipefail
          ls -la dist
          test -f dist/infamous-linux-x86_64.tar.gz && test -f dist/infamous-windows-x86_64.zip
          short=${GITHUB_SHA::7}
          cat > notes.md <<NOTES
          Build automático do commit ${short}. **Nenhum arquivo do jogo incluído**: veja o README-player.md dentro do pacote para o que copiar do seu PS4.
          Automatic build of commit ${short}. **No game files included**: see README-player.md inside the package for what to copy from your PS4.

          - Linux x86-64 (glibc 2.39+): \`infamous-linux-x86_64.tar.gz\`
          - Windows 10/11 64-bit: \`infamous-windows-x86_64.zip\`

          **Sensor de movimento e touchpad** (grafite, absorver poderes, portas): no DualShock 4/DualSense funcionam direto. Em outros controles, um toque em **L3+R3** liga/desliga o modo sensor (ou Share no Xbox Series): ele é a lata de spray do grafite: o controle fica de lado, X/A sacode, R2 pinta e o **analógico esquerdo mira** o cursor (para os lados e para cima/baixo; ele fica onde você soltar). **View/Select** é o clique do touchpad (segurar para absorver fumaça, neon...), e **View/Select + analógico direito** desliza. Teclado: T/G viram de lado (as setas miram enquanto seguram), Y sacode, F pinta (R2), Tab/Backspace clicam, Tab + setas deslizam, Tab + Backspace apertam as duas pontas (View/Select + R1 no controle: levantar o carro de cima do Reggie). A zona morta dos analógicos fica no launcher.

          **Motion sensor and touchpad** (graffiti, absorbing powers, doors): on a DualShock 4/DualSense they work as is. On other controllers, one tap on **L3+R3** toggles sensor mode (or Share on an Xbox Series): it is the graffiti's spray can: the controller is held sideways, cross/A shakes, R2 sprays and the **left stick aims** the cursor (left/right and up/down; it stays where you let go). **View/Select** is the touchpad click (hold it to absorb smoke, neon...), and **View/Select + right stick** swipes. Keyboard: T/G turn it sideways (the arrow keys aim while held), Y shakes, F sprays (R2), Tab/Backspace click, Tab + arrow keys swipe, Tab + Backspace press both ends (View/Select + R1 on a controller: lifting the car off Reggie). The stick dead zone is in the launcher.

          NOTES
          # What changed since the previous release (pt-BR + en-US, from the PRs' notes blocks).
          bash .github/scripts/release_notes.sh "$GITHUB_SHA" >> notes.md || echo "release notes: generation failed"
          # The list of game files the player needs (docs/ARQUIVOS_NECESSARIOS.md), before the download.
          sed '1,/^\[Português\]/d' docs/ARQUIVOS_NECESSARIOS.md >> notes.md
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
          else
            tag="v$(date -u +%Y.%m.%d)-${short}"
          fi
          # A re-run of the same commit finds its release already published: keep it.
          if gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Upload into a draft first, so a failed upload never leaves a half-published release.
          # Releases are kept forever as version history; nothing here deletes one.
          gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" \
            --title "$tag ($(date -u +%Y-%m-%d) · ${short})" --notes-file notes.md
          n=$(gh release view "$tag" --json assets --jq '.assets | length')
          [[ $n -ge 2 ]] || { echo "draft release has $n assets"; exit 1; }
          for try in 1 2 3; do
            gh release edit "$tag" --draft=false --latest && break
            sleep 10
          done
          [[ $(gh release view "$tag" --json isDraft --jq .isDraft) == false ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # The old rolling "nightly" release is gone: every build is now its own release.
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
      - name: Notify Discord
        # Posts the new release to #chat-geral. A Discord failure never fails the build.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GAME: InFamous Second Son
        run: |
          set -euo pipefail
          [[ -n "${DISCORD_WEBHOOK:-}" ]] || { echo "DISCORD_RELEASE_WEBHOOK not set"; exit 0; }
          tag=${{ steps.publish.outputs.tag }}; color=5763719
          short=${GITHUB_SHA::7}
          url="$GITHUB_SERVER_URL/$GH_REPO/releases/tag/$tag"
          downloads=$(gh release view "$tag" --json assets \
            --jq '[.assets[] | "• [\(.name)](\(.url))"] | join("\n")')
          # One card per release: only the "## Novidades" section of the release notes (the full
          # notes are one click away). Without that section, the commit message stands in.
          news=$(gh release view "$tag" --json body --jq .body | tr -d '\r' |
            awk '/^## Novidades/ { on = 1; next } /^## / { on = 0 } on' |
            sed -e '/./,$!d' | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}')
          [[ -n $news ]] || news="- $(git log -1 --format=%s "$GITHUB_SHA" 2>/dev/null || echo "Build $short")"
          jq -n \
            --arg title "🎮 $GAME: nova versão ($tag)" --arg url "$url" \
            --arg news "$news" --arg dl "$downloads" --arg commit "Commit $short" \
            --argjson color "$color" '
            (if ($news | length) > 3500
             then ($news[:3500] | sub("\n[^\n]*$"; "")) + "\n… [notas completas](\($url))"
             else $news end) as $d
            | {username: "Novas versões", embeds: [{title: $title, url: $url, description: $d, color: $color,
                fields: [{name: "Downloads", value: $dl}], footer: {text: $commit}}]}' |
            curl -fsS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK"
      - name: Delete older builds
        # Only after the new release is live: the previous runs and their artifacts go, the
        # current run (the one that produced this release) stays. Releases are not touched,
        # apart from leftover nightly-staging drafts of failed runs.
        if: github.ref == 'refs/heads/main'
        run: |
          set -uo pipefail
          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft and (.tagName | startswith("nightly-staging-"))) | .tagName' |
            while read -r t; do gh release delete "$t" --yes || true; done
          gh run list --workflow build.yml --status completed --limit 200 --json databaseId --jq '.[].databaseId' |
            grep -vx "$GITHUB_RUN_ID" | xargs -r -n1 gh run delete || true
